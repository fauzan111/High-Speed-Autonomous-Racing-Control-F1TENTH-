name: Grip estimation validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      calibrate:
        description: Run the diagnostic dry-controller sweep
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: grip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and real IPOPT tests
        run: python -m pytest tests -q
      - name: Matched-model estimator validation
        run: python -m scripts.validate_grip --out-dir results/synthetic_grip --seed 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-grip-evidence
          path: results/synthetic_grip
          if-no-files-found: warn
  simulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dry
            surface: dry
            wet_mu: 0.6
            required: fixed_dry fixed_wet adaptive
          - name: wet
            surface: wet
            wet_mu: 0.6
            required: fixed_wet adaptive
          - name: wet_mild
            surface: wet
            wet_mu: 0.8
            required: fixed_wet adaptive
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned simulator and project
        run: |
          git clone --branch v1.0.0 --depth 1 https://github.com/f1tenth/f1tenth_gym.git
          git -C f1tenth_gym checkout 5a301bd0ae1ceaf7dec653e7549c8d099db58a6b
          python -m pip install -e ./f1tenth_gym -r requirements.txt -r requirements-dev.txt
      - run: python -m scripts.prepare_map --map Spielberg
      - run: python -m scripts.check_environment
      - name: Dry controller calibration
        if: github.event_name == 'workflow_dispatch' && inputs.calibrate
        run: python -m scripts.tune_mpc
      - name: Corrected dry baseline
        if: matrix.name == 'dry'
        run: python -m scripts.benchmark --max-time 200 --require-completion
      - name: Controller comparison (${{ matrix.name }})
        run: python -m scripts.grip_experiment --surface ${{ matrix.surface }} --wet-mu ${{ matrix.wet_mu }} --out results/grip_${{ matrix.name }} --require-completion ${{ matrix.required }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-evidence-${{ matrix.name }}
          path: results/
          if-no-files-found: warn
